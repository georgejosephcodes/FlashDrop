events {
  worker_connections 4096;
}

http {
  upstream flashdrop_api {
    ip_hash;
    server app1:3000;
    server app2:3000;
  }

  # Rate limit: 10000 req/s for benchmarking (lower to 20 in production)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10000r/s;

  server {
    listen 80;

    location / {
      limit_req zone=api_limit burst=10000 nodelay;

      proxy_pass         http://flashdrop_api;
      proxy_http_version 1.1;

      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

      proxy_read_timeout  86400s;
      proxy_send_timeout  86400s;
    }
  }
}
