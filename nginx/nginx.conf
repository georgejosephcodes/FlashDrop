events {
  worker_connections 4096;
}

http {
  # ── Upstream: two Node.js replicas ──────────────────────────────────────
  upstream flashdrop_api {
    ip_hash;              # sticky sessions — required for WebSocket
    server app1:3000;
    server app2:3000;
  }

  # ── Rate limiting zone: 20 req/s per IP ─────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  server {
    listen 80;

    # ── API & WebSocket proxy ──────────────────────────────────────────────
    location / {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass         http://flashdrop_api;
      proxy_http_version 1.1;

      # WebSocket upgrade headers
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";

      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

      proxy_read_timeout  86400s;   # keep WS connections alive
      proxy_send_timeout  86400s;
    }
  }
}

