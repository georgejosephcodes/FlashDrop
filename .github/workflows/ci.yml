name: FlashDrop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Syntax, Integration Tests & Zero-Oversell Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src benchmark tests -name '*.js' -exec node --check {} +

      - name: Create CI environment files
        run: |
          cp .env.example .env
          sed -i 's/^SKIP_AUTH=.*/SKIP_AUTH=true/' .env
          sed -i 's/^RATE_LIMIT_PER_SECOND=.*/RATE_LIMIT_PER_SECOND=10000/' .env
          cat << 'EOF' > .env.local
          DATABASE_URL=postgresql://flashdrop:flashdrop@localhost:5433/flashdrop
          REDIS_URL=redis://localhost:6380
          EOF

      - name: Boot Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for API gateway (/health)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo ""
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for http://localhost:8080/health"
          exit 1

      - name: Run Jest integration test suite
        run: npm test

      - name: Run load smoke test and zero-oversell integrity check
        run: |
          ITEM_ID=$(curl -sf -X POST http://localhost:8080/api/items \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Smoke Drop","priceCents":100,"totalStock":50,"saleStartAt":"2026-01-01T00:00:00Z"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).id))")
          echo "Seeded CI item: $ITEM_ID"
          ITEM_ID="$ITEM_ID" CONNECTIONS=50 AMOUNT=1000 npm run benchmark
          sleep 2
          ITEM_ID="$ITEM_ID" TOTAL_STOCK=50 npm run verify

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v

